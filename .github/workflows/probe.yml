name: Probe

on:
  push:
    branches: [ probe-del ]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/live_probe_test.dart -r expanded --dart-define=MT_COOKIE="$MT_COOKIE"
        env:
          MT_COOKIE: ${{ secrets.MT_COOKIE }}
